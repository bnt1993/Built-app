(()=>{const base=Array.isArray(window.PORTAL_APPS)?window.PORTAL_APPS:[],icons=window.PORTAL_ICONS||{},$=s=>document.querySelector(s),jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}},custom=jget('portalCustomApps',[]),draftApps=jget('portalAppsDraft',null);let apps=Array.isArray(draftApps)?draftApps:[...base,...custom],filter='all',pickedIcon=Object.keys(icons)[0]||'apps',cmdIndex=0;const state={fav:jget('portalFav',[]),pin:jget('portalPin',[]),counts:jget('portalCounts',{}),recent:jget('portalRecent',[]),history:jget('portalHistory',[]),last:localStorage.getItem('portalLast')||'',current:null};const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function side(){let groups=[...new Set(apps.filter(valid).map(a=>a.group).filter(Boolean))];$('#sidebar').innerHTML=[['all','▦','Tất cả'],['fav','★','Yêu thích'],['pin','📌','Đã ghim'],...groups.map(g=>['g:'+g,'📁',g])].map(x=>`<button class="sidebtn ${filter===x[0]?'active':''}" data-filter="${esc(x[0])}">${x[1]} ${esc(x[2])}</button>`).join('')}
function listed(){let q=$('#q').value.toLowerCase().trim(),l=apps.filter(valid).filter(a=>`${a.name} ${a.desc||''} ${a.group||''} ${tags(a).join(' ')}`.toLowerCase().includes(q));if(filter==='fav')l=l.filter(a=>state.fav.includes(a.id));else if(filter==='pin')l=l.filter(a=>state.pin.includes(a.id));else if(filter.startsWith('g:'))l=l.filter(a=>a.group===filter.slice(2));let s=$('#sort').value;if(s==='name')l.sort((a,b)=>a.name.localeCompare(b.name));if(s==='used')l.sort((a,b)=>(state.counts[b.id]||0)-(state.counts[a.id]||0));if(s==='recent')l.sort((a,b)=>(state.recent.indexOf(a.id)+99*(state.recent.indexOf(a.id)<0))-(state.recent.indexOf(b.id)+99*(state.recent.indexOf(b.id)<0)));return [...l.filter(a=>state.pin.includes(a.id)),...l.filter(a=>!state.pin.includes(a.id))]}
function render(){side();let l=listed();$('#grid').innerHTML=l.map(card).join('');$('#empty').style.display=l.length?'none':'block';let r=state.recent.map(id=>apps.find(a=>a.id===id)).filter(valid).slice(0,3);$('#recentGrid').innerHTML=r.map(card).join('');$('#napps').textContent=apps.filter(valid).length;$('#opens').textContent=Object.values(state.counts).reduce((a,b)=>a+(+b||0),0);$('#favs').textContent=state.fav.length;$('#last').textContent=(apps.find(a=>a.id===state.last)||{}).name||'—';$('#recentSec').style.display=(localStorage.getItem('portalShowRecent')??'true')==='true'&&r.length?'block':'none';$('#stats').style.display=(localStorage.getItem('portalShowStats')??'true')==='true'?'grid':'none'}
let toastTimer;function showAppName(a){let t=$('#viewerToast');t.textContent=a.name;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),1200)}function navApps(){return apps.filter(valid)}function updateViewerNav(){let l=navApps(),i=l.findIndex(a=>state.current&&a.id===state.current.id);$('#viewerPos').textContent=i>=0?`${i+1} / ${l.length}`:'';$('#prevApp').disabled=l.length<2;$('#nextApp').disabled=l.length<2}function switchApp(step){let l=navApps();if(!l.length)return;let i=l.findIndex(a=>state.current&&a.id===state.current.id);if(i<0)i=0;let a=l[(i+step+l.length)%l.length];track(a);state.current=a;$('#viewerTitle').textContent=a.name;$('#frame').src=a.path;updateViewerNav();showAppName(a);render()}function track(a){state.counts[a.id]=(state.counts[a.id]||0)+1;state.recent=[a.id,...state.recent.filter(x=>x!==a.id)].slice(0,10);state.history.unshift({id:a.id,name:a.name,time:new Date().toLocaleString('vi-VN')});state.history=state.history.slice(0,100);state.last=a.id;localStorage.setItem('portalCounts',JSON.stringify(state.counts));localStorage.setItem('portalRecent',JSON.stringify(state.recent));localStorage.setItem('portalHistory',JSON.stringify(state.history));localStorage.setItem('portalLast',a.id)}function openApp(a,tab=false){track(a);state.current=a;if(tab||localStorage.getItem('portalOpenMode')==='tab')window.open(a.path,'_blank');else{$('#viewerTitle').textContent=a.name;$('#frame').src=a.path;$('#modal').classList.add('on');updateViewerNav();showAppName(a)}render()}function closeApp(){$('#modal').classList.remove('on');$('#frame').src='about:blank';state.current=null}
document.addEventListener('click',e=>{let sb=e.target.closest('.sidebtn');if(sb){filter=sb.dataset.filter;render();return}let t=e.target.closest('.tile');if(!t)return;let a=apps.find(x=>x.id===t.dataset.id);if(!a)return;if(e.target.closest('.fav')){state.fav=state.fav.includes(a.id)?state.fav.filter(x=>x!==a.id):[...state.fav,a.id];localStorage.setItem('portalFav',JSON.stringify(state.fav));render()}else if(e.target.closest('.pin')){state.pin=state.pin.includes(a.id)?state.pin.filter(x=>x!==a.id):[...state.pin,a.id];localStorage.setItem('portalPin',JSON.stringify(state.pin));render()}else if(e.target.closest('.new'))openApp(a,true);else if(e.target.closest('.edit'))editApp(a);else if(e.target.closest('.delete'))deleteApp(a);else if(e.target.closest('.open'))openApp(a,false)});$('#q').oninput=render;$('#sort').onchange=render;$('#esc').onclick=closeApp;$('#homeApp').onclick=closeApp;$('#prevApp').onclick=()=>switchApp(-1);$('#nextApp').onclick=()=>switchApp(1);$('#pop').onclick=()=>state.current&&openApp(state.current,true);$('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('portalTheme',document.body.classList.contains('dark')?'dark':'light')};
function saveAppsDraft(){localStorage.setItem('portalAppsDraft',JSON.stringify(apps.filter(valid)))}function editApp(a){if(!a)return;$('#aId').dataset.editing=a.id;$('#aId').readOnly=true;$('#aName').value=a.name||'';$('#aId').value=a.id||'';$('#aPath').value=a.path||'';$('#aGroup').value=a.group||'';$('#aDesc').value=a.desc||'';$('#aTags').value=tags(a).join(', ');$('#aVersion').value=a.version||'';$('#aUpdated').value=a.updated||'';pickedIcon=a.icon||pickedIcon;$('#stageApp').textContent='Lưu thay đổi';$('#addMsg').textContent='';document.querySelectorAll('.iconpick').forEach(x=>x.classList.toggle('on',x.dataset.icon===pickedIcon));dlg('addOverlay');preview()}function deleteApp(a){if(!a||!confirm(`Xóa ứng dụng “${a.name}” khỏi Portal?\n\nDanh sách tạm sẽ được lưu trong trình duyệt để Export apps.js sau.`))return;apps=apps.filter(x=>x.id!==a.id);custom=custom.filter(x=>x.id!==a.id);state.fav=state.fav.filter(x=>x!==a.id);state.pin=state.pin.filter(x=>x!==a.id);state.recent=state.recent.filter(x=>x!==a.id);delete state.counts[a.id];if(state.last===a.id)state.last='';localStorage.setItem('portalCustomApps',JSON.stringify(custom));localStorage.setItem('portalFav',JSON.stringify(state.fav));localStorage.setItem('portalPin',JSON.stringify(state.pin));localStorage.setItem('portalRecent',JSON.stringify(state.recent));localStorage.setItem('portalCounts',JSON.stringify(state.counts));localStorage.setItem('portalLast',state.last);saveAppsDraft();render()}function dlg(id,on=true){$('#'+id).classList.toggle('on',on)}$('#addBtn').onclick=()=>{delete $('#aId').dataset.editing;$('#aId').readOnly=false;['aName','aId','aPath','aGroup','aDesc','aTags','aVersion','aUpdated'].forEach(id=>$('#'+id).value='');$('#stageApp').textContent='Thêm vào Portal';$('#addMsg').textContent='';ensureNewAppId();dlg('addOverlay');preview();};document.querySelectorAll('.closeAdd').forEach(x=>x.onclick=()=>dlg('addOverlay',false));Object.entries(icons).forEach(([k,v])=>$('#iconPicker').insertAdjacentHTML('beforeend',`<button class="iconpick" data-icon="${esc(k)}" title="${esc(k)}">${esc(v)}</button>`));$('#iconPicker').onclick=e=>{let b=e.target.closest('.iconpick');if(!b)return;pickedIcon=b.dataset.icon;document.querySelectorAll('.iconpick').forEach(x=>x.classList.toggle('on',x===b));preview()};function makeAppId(){let id='';do{id='app-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}while(apps.some(a=>a.id===id));return id}function ensureNewAppId(){if(!$('#aId').dataset.editing){$('#aId').value=makeAppId();$('#aId').readOnly=true}}function draft(){return{id:$('#aId').value.trim(),name:$('#aName').value.trim()||'Ứng dụng mới',path:$('#aPath').value.trim(),group:$('#aGroup').value.trim(),desc:$('#aDesc').value.trim(),tags:$('#aTags').value.split(',').map(x=>x.trim()).filter(Boolean),version:$('#aVersion').value.trim(),updated:$('#aUpdated').value,icon:pickedIcon}}function preview(){$('#previewGrid').innerHTML=card(draft())}['aName','aId','aPath','aGroup','aDesc','aTags','aVersion','aUpdated'].forEach(id=>$('#'+id).oninput=preview);$('#stageApp').onclick=()=>{let editing=$('#aId').dataset.editing;if(!editing&&apps.some(x=>x.id===$('#aId').value))ensureNewAppId();let a=draft();a.path=String(a.path||'').replace(/\\/g,'/');if(!a.id||!a.name||!a.path){$('#addMsg').textContent='Cần có ID, tên và đường dẫn HTML.';return}if(editing){let i=apps.findIndex(x=>x.id===editing);if(i>=0)apps[i]=a;else apps.push(a);custom=custom.filter(x=>x.id!==editing);custom.push(a);localStorage.setItem('portalCustomApps',JSON.stringify(custom));saveAppsDraft();render();dlg('addOverlay',false);return}if(apps.some(x=>x.id===a.id)){ensureNewAppId();a=draft()}custom.push(a);apps.push(a);localStorage.setItem('portalCustomApps',JSON.stringify(custom));saveAppsDraft();$('#addMsg').textContent='Đã thêm vào Portal. Export apps.js để tải cấu hình.';render()};
function exportFile(name,text,type='text/plain'){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}$('#exportApps').onclick=()=>{let all=apps.filter(valid).map(a=>({...a,path:String(a.path||'').replace(/\\/g,'/')}));saveAppsDraft();exportFile('apps.js',`window.PORTAL_ICONS = ${JSON.stringify(icons,null,2)};\n\nwindow.PORTAL_APPS = ${JSON.stringify(all,null,2)};\n`,'text/javascript')};
$('#historyBtn').onclick=()=>{let counts={};state.history.forEach(h=>counts[h.id]=(counts[h.id]||0)+1);$('#historyList').innerHTML=state.history.length?state.history.map(h=>`<div class="history-row"><span>${esc(h.name)}</span><span>${esc(h.time)}</span><b>${counts[h.id]||1}×</b></div>`).join(''):'<div class="empty" style="display:block">Chưa có lịch sử.</div>';dlg('histOverlay')};$('.closeHist').onclick=()=>dlg('histOverlay',false);$('#clearHistory').onclick=()=>{state.history=[];state.recent=[];localStorage.removeItem('portalHistory');localStorage.removeItem('portalRecent');$('#historyList').innerHTML='Đã xóa lịch sử.';render()};
function cmdRender(){let q=$('#cmdInput').value.toLowerCase(),l=apps.filter(valid).filter(a=>`${a.name} ${tags(a).join(' ')}`.toLowerCase().includes(q)).slice(0,7);cmdIndex=Math.min(cmdIndex,Math.max(0,l.length-1));$('#cmdList').innerHTML=l.map((a,i)=>`<div class="cmdresult ${i===cmdIndex?'sel':''}" data-id="${esc(a.id)}">${esc(icons[a.icon]||'▦')} &nbsp; <b>${esc(a.name)}</b> <small>${esc(a.group||'')}</small></div>`).join('');return l}$('#cmdInput').oninput=()=>{cmdIndex=0;cmdRender()};$('#cmdInput').onkeydown=e=>{let l=cmdRender();if(e.key==='ArrowDown'){e.preventDefault();cmdIndex=Math.min(cmdIndex+1,l.length-1);cmdRender()}if(e.key==='ArrowUp'){e.preventDefault();cmdIndex=Math.max(cmdIndex-1,0);cmdRender()}if(e.key==='Enter'&&l[cmdIndex]){dlg('cmdOverlay',false);openApp(l[cmdIndex],false)}};$('#cmdList').onclick=e=>{let r=e.target.closest('.cmdresult');if(r){dlg('cmdOverlay',false);openApp(apps.find(a=>a.id===r.dataset.id),false)}};
document.addEventListener('keydown',e=>{if($('#modal').classList.contains('on')&&e.altKey&&e.key.toLowerCase()==='h'){e.preventDefault();closeApp();return}if($('#modal').classList.contains('on')&&e.altKey&&e.key==='ArrowLeft'){e.preventDefault();switchApp(-1);return}if($('#modal').classList.contains('on')&&e.altKey&&e.key==='ArrowRight'){e.preventDefault();switchApp(1);return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();dlg('cmdOverlay');$('#cmdInput').value='';cmdIndex=0;cmdRender();setTimeout(()=>$('#cmdInput').focus(),0)}else if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeApp();else['cmdOverlay','addOverlay','histOverlay'].forEach(id=>dlg(id,false));$('#settingsPanel').classList.remove('on')}});
$('#settings').onclick=()=>$('#settingsPanel').classList.toggle('on');apps.filter(valid).forEach(a=>$('#startup').add(new Option(a.name,a.id)));function applySettings(v,o,start,recent,stats,cols){document.body.classList.remove('compact','large');if(v!=='normal')document.body.classList.add(v);document.documentElement.style.setProperty('--cols',cols==='auto'?'3':cols);$('#recentSec').style.display=recent?'block':'none';$('#stats').style.display=stats?'grid':'none'}function loadSettings(){let v=localStorage.getItem('portalView')||'normal',o=localStorage.getItem('portalOpenMode')||'portal',st=localStorage.getItem('portalStartup')||'',r=(localStorage.getItem('portalShowRecent')??'true')==='true',ss=(localStorage.getItem('portalShowStats')??'true')==='true',c=localStorage.getItem('portalColumns')||'auto';Object.assign($('#viewMode'),{value:v});Object.assign($('#openMode'),{value:o});Object.assign($('#startup'),{value:st});$('#showRecent').checked=r;$('#showStats').checked=ss;$('#columns').value=c;applySettings(v,o,st,r,ss,c)}$('#settingsSave').onclick=()=>{localStorage.setItem('portalView',$('#viewMode').value);localStorage.setItem('portalOpenMode',$('#openMode').value);localStorage.setItem('portalStartup',$('#startup').value);localStorage.setItem('portalShowRecent',$('#showRecent').checked);localStorage.setItem('portalShowStats',$('#showStats').checked);localStorage.setItem('portalColumns',$('#columns').value);loadSettings();render();$('#settingsMsg').textContent='Đã lưu cài đặt.'};$('#settingsReset').onclick=()=>{['portalView','portalOpenMode','portalStartup','portalShowRecent','portalShowStats','portalColumns'].forEach(k=>localStorage.removeItem(k));loadSettings();render();$('#settingsMsg').textContent='Đã reset về mặc định.'};$('#exportSettings').onclick=()=>exportFile('portal-settings.json',JSON.stringify({view:$('#viewMode').value,openMode:$('#openMode').value,startup:$('#startup').value,showRecent:$('#showRecent').checked,showStats:$('#showStats').checked,columns:$('#columns').value,fav:state.fav,pin:state.pin},null,2),'application/json');$('#importSettings').onclick=()=>$('#settingsFile').click();$('#settingsFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(x.view)localStorage.setItem('portalView',x.view);if(x.openMode)localStorage.setItem('portalOpenMode',x.openMode);localStorage.setItem('portalStartup',x.startup||'');localStorage.setItem('portalShowRecent',x.showRecent!==false);localStorage.setItem('portalShowStats',x.showStats!==false);localStorage.setItem('portalColumns',x.columns||'auto');if(Array.isArray(x.fav)){state.fav=x.fav;localStorage.setItem('portalFav',JSON.stringify(x.fav))}if(Array.isArray(x.pin)){state.pin=x.pin;localStorage.setItem('portalPin',JSON.stringify(x.pin))}loadSettings();render();$('#settingsMsg').textContent='Import thành công.'}catch{$('#settingsMsg').textContent='File JSON không hợp lệ.'}};r.readAsText(f)};
let bad=apps.filter(a=>!valid(a));if(bad.length)$('#configWarn').textContent=`⚠ Có ${bad.length} cấu hình app thiếu id/name/path và đã được bỏ qua.`;if(localStorage.getItem('portalTheme')==='dark')document.body.classList.add('dark');loadSettings();render();let start=apps.find(a=>a.id===localStorage.getItem('portalStartup'));if(start)setTimeout(()=>openApp(start,false),120);
