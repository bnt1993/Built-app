name: Spare Parts Portal tests

on:
  pull_request:
    paths:
      - Spare_Parts_Portal.html
      - apps.js
      - tests/spare_parts_portal_*.cjs
      - .github/workflows/portal-tests.yml
  push:
    branches: [main]
    paths:
      - Spare_Parts_Portal.html
      - apps.js
      - tests/spare_parts_portal_*.cjs
      - .github/workflows/portal-tests.yml

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test catalog, settings and navigation logic
        run: node --test tests/spare_parts_portal_logic.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Test the Portal on mobile Chromium
        run: node --test tests/spare_parts_portal_browser.cjs
