name: Checking dashboard regression tests

on:
  pull_request:
    paths:
      - Checking
      - Amount.js
      - HistoryWorker.js
      - History.js
      - Database
      - scripts/**
      - tests/**
      - .github/workflows/checking-tests.yml
  push:
    branches: [main]
    paths:
      - Checking
      - Amount.js
      - HistoryWorker.js
      - History.js
      - Database
      - scripts/**
      - tests/**
      - .github/workflows/checking-tests.yml

permissions:
  contents: read

jobs:
  dashboard-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Amount.js reader and refresh
        run: node tests/amount_logic.cjs
      - name: Validate filtered report exports
        run: node tests/dashboard_export_logic.cjs
      - name: Verify source versioning, percentage and drilldown logic
        run: node tests/dashboard_sources_logic.cjs
      - name: Validate local metadata generator
        run: python3 tests/test_prepare_stock_assets.py
      - name: Validate Stock, History and performance regressions
        run: |
          node tests/checking_logic.cjs
          node tests/history_logic.cjs
          node tests/dashboard_logic.cjs
          node tests/dashboard_scope_period_logic.cjs
          node tests/checking_performance_logic.cjs
      - name: Validate catalog exports and responsive image generation
        run: |
          python3 -m pip install -r scripts/requirements-images.txt
          python3 tests/test_validate_catalog.py
          python3 tests/test_material_images.py
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Check dashboard interactions
        run: node tests/dashboard_sources_browser.cjs
      - name: Verify independent Database material catalog
        run: node tests/checking_catalog_browser.cjs
      - name: Verify Stock, History and performance updates in Chromium
        run: |
          checking_browser_status=0
          for checking_browser_test in tests/checking_browser.cjs tests/dashboard_browser.cjs tests/dashboard_report_summary_browser.cjs tests/dashboard_scope_period_browser.cjs tests/checking_performance_browser.cjs; do
            if ! node "$checking_browser_test"; then checking_browser_status=1; fi
          done
          exit "$checking_browser_status"
