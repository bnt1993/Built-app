name: Offline HTML hub

on:
  pull_request:
    paths:
      - HTML_Hub.html
      - Mo_HTML_Hub.bat
      - tests/html_hub_browser.cjs
      - .github/workflows/html-hub.yml
  push:
    branches: [main]
    paths:
      - HTML_Hub.html
      - Mo_HTML_Hub.bat
      - tests/html_hub_browser.cjs
      - .github/workflows/html-hub.yml

permissions:
  contents: read

jobs:
  offline-html:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Validate file-based offline hub
        run: node tests/html_hub_browser.cjs
