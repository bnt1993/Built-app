<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sơ đồ kho 3D | Tra cứu vật tư</title>
<style>
:root {
  color-scheme: light;
  --bg: #f2f5f7;
  --panel: #fff;
  --ink: #162b3b;
  --muted: #4c6474;
  --line: #cbd8e0;
  --blue: #075e73;
  --primary: #086177;
  --soft: #e6f2f5;
  --scene: #e9f0f3;
  --empty: #f7fafc;
  --occupied: #deecf5;
  --hit: #ffe5a2;
  --hit-border: #a25a06;
  --hit-ink: #5a3000;
  --danger: #a52432;
  --focus: #087eaa;
}
.dark {
  color-scheme: dark;
  --bg: #111c26;
  --panel: #192a37;
  --ink: #edf5fa;
  --muted: #b1c7d4;
  --line: #435c6b;
  --blue: #95deeb;
  --primary: #086177;
  --soft: #254552;
  --scene: #101f2a;
  --empty: #203341;
  --occupied: #2b4b60;
  --hit: #ffd884;
  --hit-border: #b47427;
  --danger: #ffa9ae;
  --focus: #86d6f9;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
}
button, input, select, textarea { font: inherit; }
button, select { cursor: pointer; }
button, select, input[type="search"] {
  min-height: 36px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  color: var(--ink);
}
button { padding: 6px 11px; font-weight: 620; }
button:hover:not(:disabled), select:hover { border-color: var(--blue); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
button.danger { color: var(--danger); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
.muted { color: var(--muted); font-size: 12px; }
.actions { display: flex; gap: 7px; flex-wrap: wrap; }

.topbar { background: #102e40; color: #fff; }
.topbar-inner {
  max-width: 1500px;
  margin: auto;
  padding: 14px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 16px;
}
.topbar h1 { font-size: clamp(20px, 2.5vw, 26px); line-height: 1.2; }
.topbar p { color: #c1d8e3; font-size: 13px; margin: 3px 0 0; }
.topbar button { background: #1c4053; color: #fff; border-color: #527489; }
.topbar button:hover:not(:disabled) { border-color: #acd3e3; }

main { max-width: 1500px; margin: auto; padding: 14px 24px 28px; }
.panel, .data-panel {
  min-width: 0;
  padding: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.data-panel { padding: 8px 14px; margin-bottom: 12px; }
summary {
  cursor: pointer;
  color: var(--blue);
  font-weight: 650;
  width: fit-content;
  max-width: 100%;
}
.data-panel summary { width: 100%; overflow-wrap: anywhere; }
.data-panel summary span + span { margin-inline-start: 8px; font-weight: 500; }
.data-content { padding: 10px 0 4px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(116px, 1fr)); gap: 8px; margin-top: 10px; }
.stat { background: var(--bg); border-radius: 7px; padding: 7px 10px; }
.stat b { display: block; font-size: 18px; }
.notice { padding: 9px 12px; margin-bottom: 12px; background: var(--hit); color: var(--hit-ink); border-radius: 7px; }

.layout { display: grid; gap: 14px; align-items: start; }
.layout.has-detail { grid-template-columns: minmax(0, 1fr) minmax(340px, 1fr); }
.title { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.pill {
  background: var(--soft);
  color: var(--blue);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 650;
  padding: 3px 8px;
}
.scene-search label { display: block; font-size: 15px; font-weight: 700; margin-bottom: 5px; }
.search-controls { display: flex; gap: 6px; }
.scene-search input { width: 100%; min-width: 0; padding: 9px 11px; min-height: 42px; font-size: 16px; }
.scene-search input::-webkit-search-cancel-button { display: none; }
.map-toolbar, .map-controls, .search-navigation {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.map-toolbar {
  justify-content: space-between;
  gap: 8px;
  margin: 10px 0;
}
.view-switch, .angle, .scene-tools { display: inline-flex; align-items: center; gap: 4px; }
.view-switch {
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--bg);
}
.view-switch button { background: transparent; border-color: transparent; min-height: 33px; }
.view-switch button[aria-pressed="true"] { background: var(--soft); color: var(--blue); border-color: var(--line); }
.angle label { font-size: 12px; }
.angle input { width: clamp(62px, 8vw, 104px); accent-color: var(--primary); }
.scene-tools button { min-width: 35px; padding-inline: 7px; }
#fullscreen { white-space: nowrap; }

.search-summary {
  margin-bottom: 10px;
  padding: 9px 10px;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 8px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 7px 12px;
}
#sceneInfo { flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
#sceneInfo strong { display: block; font-size: 14px; }
#sceneInfo span, #sceneCount { color: var(--muted); font-size: 12px; }
#sceneCount { font-variant-numeric: tabular-nums; margin: 0 3px 0 0; }
.search-navigation button { min-width: 36px; }
.scene {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--scene);
  max-height: clamp(390px, 68vh, 660px);
}
.scene svg {
  display: block;
  width: 100%;
  height: clamp(330px, 58vh, 560px);
  touch-action: pan-x pan-y;
}
.scene polygon { stroke-linejoin: round; }
.scene .pick { cursor: pointer; }
.scene .pick:hover, .scene .pick:focus-visible {
  stroke: var(--focus);
  stroke-width: 3px;
  outline: none;
}
.scene .hot-slot { stroke: #ab570c; stroke-width: 2px; }
.scene .svg-label { fill: var(--ink); }
.scene .svg-marker { stroke: var(--panel); stroke-width: 3px; paint-order: stroke; }
.map-marker { cursor: pointer; }
.map-marker rect { fill: var(--panel); stroke: var(--line); }
.map-marker:hover rect, .map-marker:focus-visible rect { stroke: var(--focus); stroke-width: 2px; }
.map-marker text { fill: var(--ink); }
.scene-placeholder { padding: 82px 18px; text-align: center; color: var(--muted); }

.elevation { padding: 10px clamp(6px, 1.5vw, 20px); max-width: 1500px; margin: auto; }
.elevation-heading, .bay-name, .elevation-aisle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 5px;
}
.elevation-heading { margin: 0 0 5px; }
.elevation-heading h3 { color: var(--ink); }
.elevation-heading span { color: var(--muted); font-size: 11px; text-align: right; }
.elevation-bays { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.elevation-bay {
  display: grid;
  grid-template-rows: auto 1fr;
  min-width: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 7px;
  overflow: hidden;
}
.bay-name { padding: 3px 7px; background: var(--soft); font-size: 12px; }
.elevation-stock { display: flex; flex-direction: column; gap: 3px; padding: 3px; }
.elevation-cabinets { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; }
.elevation-cabinet { display: flex; flex-direction: column; min-width: 0; }
.cabinet-name { text-align: center; font-size: 11px; font-weight: 750; padding: 1px; }
.elevation-levels { flex: 1; display: grid; grid-template-rows: var(--level-grid); gap: 2px; }
.elevation-slot {
  display: flex;
  align-items: center;
  padding: 0 4px;
  min-width: 0;
  min-height: 17px;
  border-radius: 3px;
  background: var(--empty);
  border: 1px solid var(--line);
  font-size: 11px;
  font-weight: 650;
  line-height: 1;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.elevation-slot:hover:not(:disabled) { background: var(--soft); }
.elevation-slot.cab-level { background: var(--soft); color: var(--blue); }
.elevation-slot.hit { background: var(--hit); color: var(--hit-ink); border-color: var(--hit-border); }
.elevation-slot.current {
  background: var(--hit);
  color: var(--hit-ink);
  border-color: var(--hit-border);
  box-shadow: inset 0 0 0 2px var(--primary);
}
.elevation-slot.current::after { content: "●"; margin-inline-start: auto; font-size: 8px; }
.elevation-aisle {
  margin: 6px 0;
  padding: 3px 8px;
  min-height: 26px;
  border: 1px dashed var(--line);
  border-radius: 5px;
  font-size: 11px;
  color: var(--muted);
}
.elevation-empty { align-self: center; padding: 8px; font-size: 11px; color: var(--muted); }

.map-footer {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px 12px;
  margin-top: 10px;
}
.map-footer label { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; font-weight: 650; }
.map-footer select { min-width: 0; max-width: min(280px, 63vw); padding: 4px 7px; }
#mapSettings .actions { margin-top: 6px; }
.results-panel { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.resultlist { max-height: 270px; overflow: auto; display: grid; gap: 5px; margin-top: 7px; padding: 2px; }
.result { display: flex; justify-content: space-between; align-items: center; text-align: left; gap: 8px; width: 100%; font-weight: 400; }
.result.active { border-color: var(--blue); background: var(--soft); }
.result b { display: block; overflow-wrap: anywhere; }
.result .pill { flex-shrink: 0; }

.path { background: var(--soft); border-radius: 6px; padding: 7px 9px; font-weight: 680; color: var(--blue); overflow-wrap: anywhere; }
.drawerlist { display: flex; flex-wrap: wrap; gap: 4px; margin: 9px 0; }
.drawerlist button { min-width: 34px; padding: 3px 6px; }
.drawerlist button.hit { background: var(--hit); color: var(--hit-ink); border-color: var(--hit-border); }
.drawerlist button.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
.tray-caption { color: var(--muted); font-size: 12px; margin: 0 0 4px; }
.tray {
  max-height: 400px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--scene);
}
.traycolumns {
  display: grid;
  grid-template-columns: repeat(var(--row-count), minmax(92px, 1fr));
  gap: 4px;
  width: max(100%, calc(var(--row-count) * 96px + 6px));
  padding: 0 5px 5px;
}
.trayrow { display: flex; flex-direction: column; gap: 4px; }
.rowlabel {
  position: sticky;
  top: 0;
  margin-bottom: auto;
  z-index: 1;
  background: var(--scene);
  text-align: center;
  padding: 4px 0;
  font-size: 11px;
  font-weight: 750;
  color: var(--muted);
}
.cell {
  width: 100%;
  min-width: 0;
  min-height: 43px;
  padding: 4px;
  border-radius: 4px;
  background: var(--empty);
  line-height: 1.25;
  overflow-wrap: anywhere;
}
.cell span { display: block; }
.cell.occupied, .legend .is-occupied { background: var(--occupied); }
.cell.hit, .legend .is-hit { background: var(--hit); color: var(--hit-ink); border-color: var(--hit-border); }
.cell.selected { outline: 2px solid var(--focus); outline-offset: -3px; }
.cell .code { font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; }
.cell .qty { font-size: 11px; font-weight: 530; }
.handle { background: var(--soft); color: var(--blue); font-size: 11px; text-align: center; padding: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 6px; font-size: 11px; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--line); }
.legend .is-empty { background: var(--empty); }
.detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.info { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin: 8px 0; }
.info div { background: var(--bg); border-radius: 6px; padding: 6px 8px; overflow-wrap: anywhere; }
.info b { display: block; }
.info .zero-stock { color: var(--danger); }
.empty { color: var(--muted); padding: 7px 0; }

.modal { border: 1px solid var(--line); border-radius: 10px; padding: 16px; max-width: min(640px, 94vw); width: 100%; background: var(--panel); color: var(--ink); }
.modal::backdrop { background: #0d203a99; }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin: 10px 0; }
.formgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.formgrid input, .formgrid textarea, .formgrid select { border: 1px solid var(--line); border-radius: 7px; padding: 8px; color: var(--ink); background: var(--panel); width: 100%; }
.wide { grid-column: 1 / -1; }
.toast { position: fixed; bottom: 16px; right: 16px; padding: 10px 13px; background: #143752; color: #fff; border-radius: 7px; display: none; z-index: 20; max-width: 90vw; }
.toast.show { display: block; }

body.map-expanded { overflow: hidden; }
#layout.is-expanded {
  position: fixed;
  inset: 0;
  z-index: 12;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 12px;
  background: var(--bg);
}
#layout.is-expanded .scene { max-height: 75dvh; }
#layout.is-expanded .scene svg { height: clamp(340px, 70dvh, 900px); }

@media (max-width: 920px) {
  .layout.has-detail { grid-template-columns: minmax(0, 1fr); }
  .layout.has-detail .drawer-panel { grid-row: 2; }
}
@media (max-width: 520px) {
  main, .topbar-inner { padding-inline: 9px; }
  .panel, .data-panel { padding: 8px; }
  .map-toolbar, .map-controls { gap: 5px; }
  .map-controls { width: 100%; }
  .angle { width: 100%; }
  .scene-tools + button { margin-inline-start: auto; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .formgrid { grid-template-columns: minmax(0, 1fr); }
  .elevation-stock { padding-inline: 2px; }
  .scene svg { height: clamp(280px, 48vh, 440px); }
  #layout.is-expanded { padding: 6px; }
}
@media (min-width: 921px) {
  .elevation { display: grid; grid-template-columns: minmax(0, 1fr) 38px minmax(0, 1fr); gap: 8px; }
  .elevation-aisle { justify-content: center; writing-mode: vertical-rl; margin: 25px 0 0; }
  .layout.has-detail .scene svg { height: clamp(380px, 67vh, 620px); }
}
@media (min-width: 600px) {
  .elevation-bays { gap: 7px; }
  .elevation-slot { min-height: 18px; padding-inline: 7px; }
}
@media print {
  .topbar button, .data-panel, .notice, .scene-search, .map-toolbar, .map-footer, .results-panel,
  .search-navigation, .actions, .drawerlist { display: none !important; }
  #layout.is-expanded { position: static; padding: 0; overflow: visible; }
  .layout.has-detail { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .scene, .tray { max-height: none; overflow: visible; }
  .scene svg { height: 320px; }
  .traycolumns { width: 100%; grid-template-columns: repeat(var(--row-count), minmax(0, 1fr)); }
  body { background: #fff; color: #000; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div>
      <h1>Sơ đồ kho 3D</h1>
      <p>Tra cứu vị trí vật tư</p>
    </div>
    <div class="actions">
      <button id="theme" type="button" aria-pressed="false">Chế độ tối</button>
      <button type="button" onclick="window.print()">In vị trí</button>
    </div>
  </div>
</header>

<main>
  <details id="dataMenu" class="data-panel">
    <summary>
      <span>Nguồn dữ liệu</span>
      <span id="lxStatus" class="muted" role="status">Đang tải data.js…</span>
    </summary>
    <div class="data-content">
      <div class="actions">
        <button id="pickLX" class="primary" type="button">Chọn Excel LX02</button>
        <button id="importBtn" type="button">Nhập CSV / JSON</button>
        <button id="exportBtn" type="button">Sao lưu JSON</button>
        <button id="templateBtn" type="button">Tải CSV mẫu</button>
        <button id="resetBtn" class="danger" type="button">Khởi tạo kho trống</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </details>
  <input id="lxFile" type="file" accept=".xlsx,.xls" hidden>
  <input id="file" type="file" accept=".csv,.json" hidden>
  <div id="notice" class="notice" role="status" hidden></div>

  <div id="layout" class="layout">
    <section id="mapPanel" class="panel map-panel" aria-label="Sơ đồ kho">
      <form id="searchForm" class="scene-search" role="search">
        <label for="sceneQ">Tìm vật tư trên sơ đồ</label>
        <div class="search-controls">
          <input id="sceneQ" type="search" autocomplete="off" title="Ngăn cách nhiều mã bằng dấu phẩy" placeholder="Mã SAP, tên, mã phụ tùng hoặc Bin">
          <button id="sceneClear" type="button" hidden>Xóa</button>
        </div>
      </form>

      <div class="map-toolbar">
        <div class="view-switch" role="group" aria-label="Chế độ xem kho">
          <button id="view3d" type="button" aria-pressed="true">Toàn cảnh 3D</button>
          <button id="viewFront" type="button" aria-pressed="false">Mặt đứng hai dãy</button>
        </div>
        <div class="map-controls">
          <div id="angleControls" class="angle">
            <label for="angle">Góc nhìn</label>
            <input id="angle" type="range" min="-1" max="1" step="0.05" value="0">
            <button id="frontReset" type="button">Nhìn thẳng</button>
          </div>
          <div id="sceneTools" class="scene-tools" role="group" aria-label="Thu phóng sơ đồ">
            <button type="button" data-zoom="out" aria-label="Thu nhỏ">−</button>
            <button type="button" data-zoom="reset" aria-label="Đặt lại mức thu phóng">100%</button>
            <button type="button" data-zoom="in" aria-label="Phóng to">+</button>
          </div>
          <button id="fullscreen" type="button" aria-pressed="false">Toàn màn hình</button>
        </div>
      </div>

      <div id="searchSummary" class="search-summary" hidden>
        <div id="sceneInfo" aria-live="polite"></div>
        <div class="search-navigation">
          <span id="sceneCount"></span>
          <button id="scenePrev" type="button" aria-label="Kết quả trước">‹</button>
          <button id="sceneNext" type="button" aria-label="Kết quả tiếp theo">›</button>
          <button id="openResult" type="button" class="primary">Mở vị trí</button>
        </div>
      </div>

      <div id="scene" class="scene" aria-label="Vùng hiển thị sơ đồ" tabindex="0"></div>

      <div class="map-footer">
        <label for="cablist">Tủ / kệ
          <select id="cablist"></select>
        </label>
        <details id="mapSettings">
          <summary>Cấu hình vị trí</summary>
          <div class="actions">
            <button id="addCab" type="button">+ Thêm tủ</button>
            <button id="editCab" type="button">Sửa cấu hình tủ / kệ</button>
            <button id="editDrawer" type="button">Sửa cấu hình ngăn / tầng</button>
            <button id="appendLX" type="button">+ Chèn mã vào hàng</button>
          </div>
        </details>
      </div>

      <details id="resultsPanel" class="results-panel" hidden>
        <summary>Danh sách kết quả</summary>
        <div id="results" class="resultlist"></div>
      </details>
    </section>

    <section id="drawerPanel" class="panel drawer-panel" aria-labelledby="drawerTitle" hidden>
      <div class="title">
        <h2 id="drawerTitle" tabindex="-1">Sơ đồ ngăn</h2>
        <span class="pill" id="drawerBadge"></span>
      </div>
      <div id="path" class="path"></div>
      <div id="drawerlist" class="drawerlist"></div>
      <p class="tray-caption">Phía sau</p>
      <div id="tray" class="tray"></div>
      <div class="legend" aria-label="Chú giải">
        <span><i class="is-occupied"></i>Có vật tư</span>
        <span><i class="is-hit"></i>Kết quả tìm</span>
        <span><i class="is-empty"></i>Ô trống</span>
      </div>
      <div id="detail" class="detail"></div>
    </section>
  </div>
</main>

<dialog id="dlg" class="modal" aria-labelledby="dlgTitle">
  <form id="dlgForm">
    <div class="title">
      <h2 id="dlgTitle"></h2>
      <button type="button" id="closeDlg">Đóng</button>
    </div>
    <div id="dlgBody"></div>
    <div class="actions">
      <button type="submit" class="primary" id="saveDlg">Lưu</button>
      <button type="button" id="deleteDlg" class="danger" hidden>Xóa</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script src="data.js"></script>
<script>

const makeCab=(id,name,drawers=14,rows=[6,6,6,6,6])=>({id,name,drawers,rows,overrides:{}});const demo=()=>({demo:true,cabinets:[makeCab('T03','LAGER 03'),makeCab('T04','LAGER 04',14,[5,6,6,5,5]),makeCab('T05','LAGER 05')],items:[['100001','Vòng bi 6205',24,'Cái','T03',3,2,4],['100002','Bu lông M8 × 30',120,'Cái','T03',3,4,2],['100003','Cảm biến tiệm cận',8,'Cái','T04',7,1,3],['100001','Vòng bi 6205',12,'Cái','T05',5,3,1],['100004','Phớt dầu 35 × 52',16,'Cái','T03',3,5,6],['100005','Đầu nối khí nén',0,'Cái','T04',2,5,2],['100006','Cầu chì 10A',30,'Cái','T05',12,2,5]].map(a=>({id:uid(),code:a[0],name:a[1],qty:a[2],unit:a[3],cab:a[4],drawer:a[5],row:a[6],cell:a[7]}))});function sortStockRows(){const groups=new Map(),cmp=new Intl.Collator('vi',{numeric:true,sensitivity:'base'});for(const i of db.items){const k=JSON.stringify([i.cab,i.drawer,i.row]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i)}for(const a of groups.values()){a.sort((x,y)=>cmp.compare(x.code,y.code)||x.code.localeCompare(y.code)||String(x.unit).localeCompare(String(y.unit)));a.forEach((i,n)=>i.cell=n+1);const i=a[0],c=db.cabinets.find(c=>c.id===i.cab);if(c){const rr=[...(c.overrides[i.drawer]||c.rows)];rr[i.row-1]=Math.max(rr[i.row-1]||1,a.length);c.overrides[i.drawer]=rr}}const selected=db.items.find(i=>i.id===selectedItem);if(selected)selectedCell=[selected.row,selected.cell]}

function stockColumnIndexes(header) {
  if (!Array.isArray(header)) return null;
  const labels = header.map(label => norm(label).trim().replace(/\s+/g, ' '));
  const columns = Object.fromEntries(Object.entries(stockFields)
    .map(([field, label]) => [field, labels.indexOf(norm(label))]));
  if (Object.values(columns).includes(-1)) return null;
  columns.part = labels.findIndex(label => label === 'part no' || label === 'part no.');
  columns.reference = labels.indexOf('sap code');
  return columns;
}

// Match the decimal separators used by the stock list in Checking.html.
function parseStockQuantity(value) {
  if (typeof value === 'number') return value;
  const text = typeof value === 'string' ? value.replace(/\s/g, '') : '';
  if (!text) return NaN;
  if (text.includes('.') && text.includes(',')) {
    return Number(text.lastIndexOf(',') > text.lastIndexOf('.')
      ? text.replace(/\./g, '').replace(',', '.')
      : text.replace(/,/g, ''));
  }
  if (/^-?\d{1,3}(?:\.\d{3}){2,}$/.test(text)) return Number(text.replace(/\./g, ''));
  return Number(text.replace(',', '.'));
}

function buildStock(table, columns, formattedTable = table) {
  const cabinets = new Map();
  const items = new Map();
  const counts = new Map();
  const stockText = value => String(value ?? '').trim();

  for (let index = 1; index < table.length; index++) {
    const row = table[index];
    if (!Array.isArray(row)) continue;
    const labels = formattedTable[index] ?? row;
    const code = stockText(labels[columns.code] ?? row[columns.code]);
    const bin = stockText(labels[columns.bin] ?? row[columns.bin]);
    const qty = parseStockQuantity(row[columns.qty]);
    if (!bin || !code || !Number.isFinite(qty)) continue;

    const unit = stockText(row[columns.unit]);
    const part = stockText(labels[columns.part] ?? row[columns.part]);
    const reference = stockText(labels[columns.reference] ?? row[columns.reference]);
    const itemKey = JSON.stringify([bin, code, unit]);
    const existing = items.get(itemKey);
    if (existing) {
      existing.qty += qty;
      existing.part ||= part;
      existing.reference ||= reference;
      continue;
    }

    const number = bin.slice(0, 2);
    const levels = rackLevels[number] || 5;
    const isCabinet = /^\d{6}$/.test(bin) && Number(bin.slice(2, 4)) >= 1 && Number(bin.slice(4)) >= 1;
    const isRack = /^\d{4}$/.test(bin) && Number(bin.slice(2)) >= 1 && Number(bin.slice(2)) <= levels;
    const id = isCabinet ? 'T' + number : isRack ? 'K' + number : 'X-' + bin;
    const drawer = isCabinet ? Number(bin.slice(2, 4)) : isRack ? Number(bin.slice(2)) : 1;
    const rowNumber = isCabinet ? Number(bin.slice(4)) : 1;
    let cabinet = cabinets.get(id);
    if (!cabinet) {
      const name = isCabinet ? 'Tủ ' + number : isRack ? 'Kệ ' + number : 'Vị trí ' + bin;
      cabinet = makeCab(id, name, isCabinet ? drawerCount(id) : isRack ? levels : 1,
        isCabinet ? [1, 1, 1, 1, 1] : [1]);
      cabinet.kind = isCabinet ? 'cab' : isRack ? 'rack' : 'other';
      cabinets.set(id, cabinet);
    }
    cabinet.drawers = Math.max(cabinet.drawers, drawer);
    while (cabinet.rows.length < rowNumber) cabinet.rows.push(1);

    const rowKey = JSON.stringify([id, drawer, rowNumber]);
    const cell = (counts.get(rowKey) || 0) + 1;
    counts.set(rowKey, cell);
    items.set(itemKey, {
      id: uid(), code, name: stockText(row[columns.name]) || code, qty, unit, part, reference,
      cab: id, drawer, row: rowNumber, cell, bin, note: 'Bin SAP: ' + bin
    });
  }

  for (const bay of warehouseBays) {
    const rackId = 'K' + bay.rack;
    if (!cabinets.has(rackId)) {
      cabinets.set(rackId, { ...makeCab(rackId, 'Kệ ' + bay.rack, rackLevels[bay.rack], [1]), kind: 'rack' });
    }
    for (const number of bay.cabs) {
      const id = 'T' + number;
      if (!cabinets.has(id)) {
        cabinets.set(id, { ...makeCab(id, 'Tủ ' + number, drawerCount(id), [1, 1, 1, 1, 1]), kind: 'cab' });
      }
    }
  }

  for (const cabinet of cabinets.values()) {
    for (let drawer = 1; drawer <= cabinet.drawers; drawer++) {
      cabinet.overrides[drawer] = cabinet.rows.map((_, index) =>
        counts.get(JSON.stringify([cabinet.id, drawer, index + 1])) || 1);
    }
  }
  return {
    demo: false,
    cabinets: [...cabinets.values()].sort((a, b) => a.id.localeCompare(b.id)),
    items: [...items.values()]
  };
}

function getWarehouseIndex() {
  if (warehouseIndex) return warehouseIndex;
  const cabinets = new Map(db.cabinets.map(cabinet => [cabinet.id, cabinet]));
  const cells = new Map();
  const occupiedDrawers = new Set();
  const searchable = db.items.map(item => {
    const { cab, drawer, row, cell } = item;
    const key = positionKey(cab, drawer, row, cell);
    if (!cells.has(key)) cells.set(key, []);
    cells.get(key).push(item);
    occupiedDrawers.add(positionKey(cab, drawer));
    const code = norm(item.code);
    const text = norm([item.code, item.name, item.part, item.reference, loc(item), cabinets.get(cab)?.name].join(' '));
    return { item, code, text };
  });
  warehouseIndex = { cabinets, cells, occupiedDrawers, searchable };
  return warehouseIndex;
}

function invalidateWarehouseIndex() {
  warehouseIndex = undefined;

function findMatches() {
  const normalized = norm(query).trim();
  if (lastQuery === normalized) return;
  lastQuery = normalized;
  const terms = normalized.split(/[;,\n]+/).map(term => term.trim()).filter(Boolean);
  const exact = [];
  const partial = [];
  if (terms.length) {
    const termSet = new Set(terms);
    for (const { item, code, text } of getWarehouseIndex().searchable) {
      if (termSet.has(code)) exact.push(item);
      else if (terms.some(term => text.includes(term))) partial.push(item);
    }
  }
  matches = exact.concat(partial);
  matchPositions = new Set();
  for (const { cab, drawer, row, cell } of matches) {
    matchPositions.add(positionKey(cab));
    matchPositions.add(positionKey(cab, drawer));
    matchPositions.add(positionKey(cab, drawer, row, cell));
  }
}

function chooseCab(id) {
  const item = matches.find(candidate => candidate.cab === id);
  if (item) selectItem(item);
  else {
    selectedCab = id;
    selectedDrawer = 1;
    selectedCell = null;
    selectedItem = null;
  }
  showDrawer();
}

function chooseDrawer(drawer, focusPanel = false) {
  selectedDrawer = drawer;

  const item = matches.find(candidate => candidate.cab === selectedCab && candidate.drawer === drawer);

  }

function updateDataStats() {
  const cabinetCount = db.cabinets.filter(cabinet => cabinet.kind !== 'rack' && cabinet.kind !== 'other').length;
  const rackCount = db.cabinets.filter(cabinet => cabinet.kind === 'rack').length;
  const metrics = [
    ['Tủ', cabinetCount],
    ['Kệ', rackCount],
    ['Ngăn / tầng', db.cabinets.filter(cabinet => cabinet.kind !== 'other').reduce((total, cabinet) => total + cabinet.drawers, 0)],
    ['Mã vật tư', new Set(db.items.map(item => item.code)).size],
    ['Ô có vật tư', getWarehouseIndex().cells.size]
  ];
  $('stats').innerHTML = metrics.map(([label, value]) =>
    '<div class="stat"><span class="muted">' + label + '</span><b>' + value.toLocaleString('vi-VN') + '</b></div>'
  ).join('');
}

function render() {
  findMatches();
  if (!cab()) {
    selectedCab = db.cabinets[0]?.id || '';
    selectedDrawer = 1;
    selectedCell = null;
    selectedItem = null;
  }
  if (cab() && selectedDrawer > cab().drawers) {
    selectedDrawer = 1;
    selectedCell = null;
    selectedItem = null;
  }
  const hasDetail = !overview && Boolean(cab());
  $('layout').classList.toggle('has-detail', hasDetail);
  $('drawerPanel').hidden = !hasDetail;
  $('view3d').setAttribute('aria-pressed', overview && warehouseView === '3d');
  $('viewFront').setAttribute('aria-pressed', overview && warehouseView === 'front');
  $('angleControls').hidden = overview && warehouseView === 'front' || !db.cabinets.length;
  $('editCab').disabled = $('editDrawer').disabled = $('appendLX').disabled = !hasDetail;

function drawFrontWarehouse() {
  const byId = getWarehouseIndex().cabinets;

    if (!cabinet) return '<span class="elevation-empty">Chưa có dữ liệu</span>';

    for (let drawer = 1; drawer <= cabinet.drawers; drawer++) {
      const weight = fittedDrawers ? drawerWeight(cabinet.id, drawer) : 1;
      sizes.push('minmax(' + (weight * 16) + 'px,' + weight + 'fr)');
      const hit = hits(cabinet.id, drawer);
      const current = active?.cab === cabinet.id && active.drawer === drawer;
      const label = cabinet.name + ' · ' + drawerName(cabinet) + ' ' + pad(drawer);
      levels.push('<button type="button" class="elevation-slot' + (fittedDrawers ? ' cab-level' : '') +

        '"' + (current ? ' aria-current="location"' : '') + '>' + pad(drawer) + '</button>');
    }
    return '<div class="elevation-levels" style="--level-grid:' + sizes.join(' ') + '">' + levels.join('') + '</div>';
  };

    const bays = warehouseBays.filter(bay => bay.side === side).map(bay => {
      const cabinets = bay.cabs.map(number => '<div class="elevation-cabinet"><div class="cabinet-name">Tủ ' +

        '</strong></div><div class="elevation-stock">' + levelButtons(byId.get('K' + bay.rack), false) +
        (cabinets ? '<div class="elevation-cabinets">' + cabinets + '</div>' : '') + '</div></div>';
    }).join('');
    return '<section><div class="elevation-heading"><h3>' + (side < 0 ? 'Dãy trái' : 'Dãy phải') +
      '</h3><span>Ngoài → Trong</span></div><div class="elevation-bays">' + bays + '</div></section>';
  };
  $('scene').innerHTML = '<div class="elevation">' + drawRow(-1) +
    '<div class="elevation-aisle"><span>Lối đi giữa</span></div>' + drawRow(1) + '</div>';
}

  };
  const label = (x, y, z, text, size = 15, id) => {
    const [left, top] = project(x, y, z);

  label(231, 2, -65, 'Dãy phải', 17);

  const ordered = [...warehouseBays].sort((a, b) => b.bay - a.bay || a.side - b.side);
  for (const bay of ordered) {
    const x0 = bay.side < 0 ? -307 : 155;
    const x1 = bay.side < 0 ? -155 : 307;
    const front = bay.side < 0 ? x1 : x0;
    const z0 = bay.bay * 294 + 10;

    const levels = byId.get(id)?.drawers || rackLevels[bay.rack];
    const pitch = (top - bottom - 20) / levels;
    for (let drawer = 1; drawer <= levels; drawer++) {
      const y = top - 28 - (drawer - 1) * pitch;
      const hit = hits(id, drawer);
      box(x0, x1, y - 6, y, z0, z1, bay.side,
        ['#b8cbd3', '#597889', hit ? '#f5bb54' : '#527184'], range(id, drawer));
      if (getWarehouseIndex().occupiedDrawers.has(positionKey(id, drawer))) {
        for (const offset of [22, 144]) {
          box(x0 + 18, x1 - 15, y, y + Math.max(5, Math.min(20, pitch - 7)), z0 + offset, z0 + offset + 79,
            bay.side, ['#dfcfad', '#aa9476', hit ? '#ffd37b' : '#c8b38c']);
        }
      }
    }
    for (const [index, number] of bay.cabs.entries()) {
      const cabinetId = 'T' + number;
      const start = z0 + 6 + index * 133;
      const end = start + 129;
      const drawers = byId.get(cabinetId)?.drawers || drawerCount(cabinetId);
      box(x0 + 5, x1 - 5, 0, 142, start, end, bay.side, ['#d8e2e7', '#90a4b0', '#b8c8d1']);
      for (let drawer = 1; drawer <= drawers; drawer++) {
        const [offset, height] = drawerGeometry(cabinetId, drawer, drawers, 129);
        const y = 137 - offset;
        const hit = hits(cabinetId, drawer);
        poly([[front,y-height+1,start+4],[front,y-height+1,end-4],[front,y,end-4],[front,y,start+4]],
          hit ? '#ffd478' : '#275774', '#7a97aa', range(cabinetId, drawer));
      }
      label(front - bay.side * 22, 149, (start + end) / 2, 'Tủ ' + number, 13, cabinetId);
    }
    for (const z of [z0, z1]) {
      for (const x of [x0, x1]) box(x - 3, x + 3, 0, top, z - 3, z + 3, bay.side, ['#678c9d', '#436275', '#567688']);
    }
    const outside = bay.side < 0 ? x0 - 10 : x1 + 10;
    label(outside, top + 16, (z0 + z1) / 2, 'Kệ ' + bay.rack, 15, id);
  }
  const xs = points.map(point => point[0]);
  const ys = points.map(point => point[1]);
  const left = Math.min(...xs) - 28;
  const top = Math.min(...ys) - 39;
  const width = Math.max(...xs) - left + 28;
  const height = Math.max(...ys) - top + 22;
  $('scene').innerHTML = '<svg viewBox="' + [left, top, width, height].join(' ') +
    '" role="group" aria-label="Toàn cảnh 3D hai dãy kho">' + shapes.join('') + labels.join('') + '</svg>';
}


function drawCabinet() {
  const cabinet = cab();
  const angle = Number($('angle').value);
  const width = 230;
  const depth = 110;
  const height = 350;
  const lean = angle * .58;
  const points = [];
  const shapes = [];
  const project = (x, y, z) => [x + z * lean, y + z * .40];
  const polygon = (vertices, fill, stroke = '#647b8c', attrs = '') => {
    const projected = vertices.map(point => project(...point));
    points.push(...projected);
    shapes.push('<polygon points="' + projected.map(point => point.join(',')).join(' ') + '" fill="' + fill +
      '" stroke="' + stroke + '" ' + attrs + '/>');
  };
  const box = (x, y, z, w, h, d, colors, attrs = '') => {
    const a = [x, y, z], b = [x + w, y, z], e = [x, y, z - d], f = [x + w, y, z - d];
    const aa = [x, y + h, z], bb = [x + w, y + h, z], ee = [x, y + h, z - d], ff = [x + w, y + h, z - d];
    polygon([e, f, b, a], colors[0]);
    polygon(lean >= 0 ? [e, a, aa, ee] : [b, f, ff, bb], colors[1]);
    polygon([a, b, bb, aa], colors[2], undefined, attrs);
  };
  const label = (x, y, z, text, size, fill) => {
    const [left, top] = project(x, y, z);
    const color = fill ? 'fill="' + fill + '"' : 'class="svg-label"';
    shapes.push('<text x="' + left + '" y="' + top + '" ' + color + ' font-size="' + size +
      '" text-anchor="middle" font-weight="700" pointer-events="none">' + esc(text) + '</text>');
  };
  const drawerAttributes = drawer => {
    const name = cabinet.name + ' · ' + drawerName(cabinet) + ' ' + pad(drawer);
    return 'class="pick" data-cab="' + esc(cabinet.id) + '" data-drawer="' + drawer +
      '" tabindex="0" role="button" aria-label="' + esc(name) + '"';
  };

  if (cabinet.kind === 'rack') {
    const spacing = height / cabinet.drawers;
    for (let drawer = 1; drawer <= cabinet.drawers; drawer++) {
      const y = (drawer - 1) * spacing;
      const hit = hits(cabinet.id, drawer);
      const selected = drawer === selectedDrawer;
      box(0, y + spacing - 8, 0, width, 8, depth, ['#b7c9d4', '#8399a7', '#58798e']);
      box(10, y + 4, -10, width - 20, Math.max(5, spacing - 15), depth - 23,
        ['#e4d7bc', '#af997b', selected ? '#29708a' : hit ? '#ffe5a2' : '#c8b390'], drawerAttributes(drawer));
      label(width / 2, y + spacing * .57, 0, 'Tầng ' + pad(drawer), 13, selected ? '#fff' : '#222c33');
    }
    for (const x of [-6, width]) box(x, -8, 3, 6, height + 8, 6, ['#7896a9', '#466677', '#54778b']);
  } else {
    box(-7, -9, 0, width + 14, height + 32, depth, ['#d1dce4', '#91a8b8', '#829caa']);
    polygon([[0,0,1],[width,0,1],[width,height+12,1],[0,height+12,1]], '#1b3d58');
    for (let drawer = 1; drawer <= cabinet.drawers; drawer++) {
      const [offset, size] = drawerGeometry(cabinet.id, drawer, cabinet.drawers, height);
      const y = 5 + offset;
      const selected = drawer === selectedDrawer;
      const hit = hits(cabinet.id, drawer);
      polygon([[3,y,3],[width-3,y,3],[width-3,y+size-1,3],[3,y+size-1,3]],
        selected ? '#12364b' : hit ? '#ffe5a2' : '#2a5976', '#7994a6', selected ? '' : drawerAttributes(drawer));
      if (!selected && size >= 12) label(17, y + size * .7, 3, pad(drawer), 10, hit ? '#5a3000' : '#fff');
    }
    const [offset, size] = drawerGeometry(cabinet.id, selectedDrawer, cabinet.drawers, height);
    const y = 5 + offset;
    const front = depth * .95;
    const rowSizes = rows(cabinet, selectedDrawer);
    box(3, y, front, width - 6, Math.max(8, size * .48), depth, ['#cddde6', '#668b9f', '#28647b']);
    for (const [index, count] of rowSizes.entries()) {
      const row = index + 1;
      const left = 5 + index * (width - 10) / rowSizes.length;
      const right = 5 + row * (width - 10) / rowSizes.length;
      for (let cell = 1; cell <= count; cell++) {
        const near = front - 4 - (cell - 1) * (depth - 8) / count;
        const far = front - 4 - cell * (depth - 8) / count;
        const hit = hits(cabinet.id, selectedDrawer, row, cell);
        const active = selectedCell?.[0] === row && selectedCell?.[1] === cell;
        const fill = hit ? '#ffe5a2' : active ? '#81c4d7' : at(row, cell).length ? '#a7cbe1' : '#edf4f7';
        const attrs = 'class="pick' + (hit ? ' hot-slot' : '') + '" data-row="' + row + '" data-cell="' +
          cell + '" tabindex="0" role="button" aria-label="Hàng ' + row + ', ô ' + cell + '"';
        polygon([[left+.5,y,far+.3],[right-.5,y,far+.3],[right-.5,y,near-.3],[left+.5,y,near-.3]],
          fill, active ? '#0e697e' : '#748d9e', attrs);
      }
    }
    const frontHeight = Math.max(9, size * .4);
    polygon([[3,y,front+1],[width-3,y,front+1],[width-3,y+frontHeight,front+1],[3,y+frontHeight,front+1]], '#d7e5eb');
    if (frontHeight >= 11) label(width / 2, y + frontHeight - 2, front + 2, 'Ngăn ' + pad(selectedDrawer), 9, '#1d3c4d');
  }
  label(width / 2, -15, 0, cabinet.name, 16);

  const xs = points.map(point => point[0]);
  const ys = points.map(point => point[1]);
  const left = Math.min(...xs) - 24;
  const top = Math.min(-30, ...ys) - 14;
  const viewWidth = Math.max(...xs) - left + 24;
  const viewHeight = Math.max(...ys) - top + 20;
  $('scene').innerHTML = '<svg viewBox="' + [left, top, viewWidth, viewHeight].join(' ') +
    '" role="group" aria-label="' + esc('Mô hình ' + cabinet.name) + '">' + shapes.join('') + '</svg>';
}


function scrollToReveal(container, target) {
  if (!target) return;
  const viewport = container.getBoundingClientRect();
  const bounds = target.getBoundingClientRect();
  const top = bounds.top - viewport.top;
  const bottom = bounds.bottom - viewport.top;
  const left = bounds.left - viewport.left;
  const right = bounds.right - viewport.left;
  if (top < 6) container.scrollTop += top - 6;
  else if (bottom > container.clientHeight - 6) container.scrollTop += bottom - container.clientHeight + 6;
  if (left < 6) container.scrollLeft += left - 6;
  else if (right > container.clientWidth - 6) container.scrollLeft += right - container.clientWidth + 6;
}

function drawScene() {
  const scene = $('scene');
  const mode = !cab() ? 'empty' : overview ? warehouseView : 'cabinet';
  if (sceneMode !== mode) {
    sceneMode = mode;
    sceneZoom = 1;
    scene.scrollTop = scene.scrollLeft = 0;
  }
  if (mode === 'front') drawFrontWarehouse();
  else if (mode === '3d') drawWarehouse();
  else if (mode === 'cabinet') drawCabinet();
  else scene.innerHTML = '<p class="scene-placeholder">Chọn nguồn dữ liệu hoặc thêm tủ để xem sơ đồ.</p>';
  applySceneZoom();
  if (mode === 'front') {
    const target = scene.querySelector('.current');
    if (target && sceneZoom === 1 && matchMedia('(max-width: 920px)').matches) {
      const side = target.closest('.elevation > section');
      scene.scrollTop += side.getBoundingClientRect().top - scene.getBoundingClientRect().top - 6;
    }
    scrollToReveal(scene, target);
  }
}

function renderTray() {
  const cabinet = cab();
  const rowSizes = rows(cabinet, selectedDrawer);
  const kind = drawerName(cabinet);
  $('drawerTitle').textContent = 'Sơ đồ ' + kind.toLowerCase();
  $('drawerBadge').textContent = rowSizes.length + ' hàng';
  const selectedPath = selectedCell ? ' › Hàng ' + pad(selectedCell[0]) + ' › Ô ' + pad(selectedCell[1]) : '';
  $('path').textContent = cabinet.name + ' › ' + kind + ' ' + pad(selectedDrawer) + selectedPath;
  const tray = $('tray');
  const columns = document.createElement('div');
  columns.className = 'traycolumns';
  columns.style.setProperty('--row-count', rowSizes.length);

  for (const [index, size] of rowSizes.entries()) {
    const row = index + 1;
    const column = document.createElement('div');
    column.className = 'trayrow';
    const label = document.createElement('span');
    label.className = 'rowlabel';
    label.textContent = 'Hàng ' + pad(row);
    column.append(label);
    for (let cell = size; cell >= 1; cell--) {
      const items = at(row, cell);
      const selected = selectedCell?.[0] === row && selectedCell?.[1] === cell;
      const item = items.find(candidate => candidate.id === selectedItem) || items[0];
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'cell';
      button.classList.toggle('occupied', Boolean(item));
      button.classList.toggle('selected', selected);
      button.classList.toggle('hit', hits(cabinet.id, selectedDrawer, row, cell));
      button.setAttribute('aria-pressed', selected);
      button.title = 'Hàng ' + row + ', ô ' + cell + ' · ' +
        (items.map(candidate => candidate.code + ' – ' + candidate.name).join(', ') || 'Trống');
      button.setAttribute('aria-label', button.title);
      button.innerHTML = item ? '<span class="code">' + esc(item.code) +
        (items.length > 1 ? ' +' + (items.length - 1) : '') + '</span><span class="qty">' +
        esc(items.length === 1 ? quantity(item) : items.length + ' mã') + '</span>' :
        '<span class="muted">—</span>';
      button.onclick = () => chooseCell(row, cell);
      column.append(button);
    }
    columns.append(column);
  }
  const handle = document.createElement('div');
  handle.className = 'handle';
  handle.textContent = cabinet.kind === 'cab' || !cabinet.kind ? 'Mặt trước / Tay kéo' : 'Mặt trước';
  const previousTop = tray.scrollTop;
  const previousLeft = tray.scrollLeft;
  tray.replaceChildren(columns, handle);
  if (selectedCell) {
    tray.scrollTop = previousTop;
    tray.scrollLeft = previousLeft;
    scrollToReveal(tray, tray.querySelector('.selected'));
  } else {
    tray.scrollTop = tray.scrollHeight;
    tray.scrollLeft = 0;
  }
}

function renderSceneInfo() {

  $('searchSummary').hidden = !hasQuery;

function renderResults() {
  const panel = $('resultsPanel');

      esc(place) + '</span></span><span class="pill">' + esc(quantity(item)) + '</span>';
    button.onclick = () => goto(item);
    fragment.append(button);

function search() {
  clearTimeout(search.timer);
  query = $('sceneQ').value.trim();
  findMatches();
  overview = true;
  warehouseView = query ? 'front' : '3d';
  selectedCell = null;
  selectedItem = null;
  if (matches.length) selectItem(matches[0]);
  render();
}

function cycleScene(delta) {
  const index = matches.indexOf(currentMatch());
  if (index < 0) return;
  selectItem(matches[(index + delta + matches.length) % matches.length]);
  overview = true;
  warehouseView = 'front';
  render();
}

function showWarehouse(view) {
  warehouseView = view;
  overview = true;
  render();
}

function applySceneZoom() {
  const scene = $('scene');
  const content = scene.firstElementChild;
  const percent = Math.round(sceneZoom * 100) + '%';
  if (content && sceneMode !== 'empty') {
    content.style.width = percent;
    content.style.maxWidth = 'none';
    if (sceneMode !== 'front') {
      content.style.height = '';
      if (sceneZoom !== 1) content.style.height = (content.getBoundingClientRect().height * sceneZoom) + 'px';
    }
  }
  const tools = $('sceneTools');
  tools.querySelector('[data-zoom="reset"]').textContent = percent;
  tools.querySelector('[data-zoom="reset"]').disabled = sceneZoom === 1;
  tools.querySelector('[data-zoom="out"]').disabled = sceneZoom === 1;
  tools.querySelector('[data-zoom="in"]').disabled = sceneZoom === 3 || sceneMode === 'empty';
}

function setFullscreen(expanded) {
  $('layout').classList.toggle('is-expanded', expanded);
  document.body.classList.toggle('map-expanded', expanded);
  document.querySelector('.topbar').inert = expanded;
  $('dataMenu').inert = expanded;
  $('fullscreen').textContent = expanded ? 'Thoát toàn màn hình' : 'Toàn màn hình';
  $('fullscreen').setAttribute('aria-pressed', expanded);
  applySceneZoom();
}

$('searchForm').onsubmit = event => {
  event.preventDefault();
  search();
};
$('sceneQ').oninput = () => {
  $('sceneClear').hidden = !$('sceneQ').value;
  clearTimeout(search.timer);
  search.timer = setTimeout(search, 160);
};
$('sceneClear').onclick = () => {
  $('sceneQ').value = '';
  search();

};
$('scenePrev').onclick = () => cycleScene(-1);

$('openResult').onclick = () => {

};
$('resultsPanel').ontoggle = renderResults;

  if (event.target.value) chooseCab(event.target.value);
  else showWarehouse(warehouseView);
};
$('view3d').onclick = () => showWarehouse('3d');
$('viewFront').onclick = () => showWarehouse('front');
$('angle').oninput = drawScene;
$('frontReset').onclick = () => {
  $('angle').value = 0;
  drawScene();
};
$('sceneTools').onclick = event => {
  const action = event.target.dataset.zoom;
  if (!action) return;
  if (action === 'reset') sceneZoom = 1;
  else sceneZoom = Math.max(1, Math.min(3, sceneZoom + (action === 'in' ? .25 : -.25)));
  applySceneZoom();
  if (action === 'reset') $('scene').scrollTop = $('scene').scrollLeft = 0;
  scrollToReveal($('scene'), $('scene').querySelector('.current'));
};

$('scene').onclick = event => {
  const target = event.target.closest('[data-cab], [data-row]');
  if (!target) return;
  if (target.dataset.row) chooseCell(Number(target.dataset.row), Number(target.dataset.cell));
  else if (!target.dataset.drawer) chooseCab(target.dataset.cab);
  else if (getWarehouseIndex().cabinets.has(target.dataset.cab)) {
    selectedCab = target.dataset.cab;
    chooseDrawer(Number(target.dataset.drawer), true);
  }
};
$('scene').onkeydown = event => {
  if (event.target.matches('svg [role="button"]') && (event.key === 'Enter' || event.key === ' ')) {
    event.preventDefault();
    event.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  }
};

$('fullscreen').onclick = async () => {
  const layout = $('layout');
  if (layout.classList.contains('is-expanded')) {
    if (document.fullscreenElement === layout) await document.exitFullscreen();
    setFullscreen(false);
    return;
  }
  setFullscreen(true);
  try {
    await layout.requestFullscreen?.();
  } catch {
    $('fullscreen').focus();
  }
};
document.addEventListener('fullscreenchange', () => {
  if (document.fullscreenElement !== $('layout')) setFullscreen(false);
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !$('dlg').open && !document.fullscreenElement &&
      $('layout').classList.contains('is-expanded')) {
    setFullscreen(false);
    $('fullscreen').focus();
  }
});

function loadLXLib() {
  if (globalThis.XLSX) return Promise.resolve();
  if (!lxLib) {
    lxLib = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      script.onload = resolve;
      script.onerror = () => {
        lxLib = null;
        script.remove();
        reject(Error('Không tải được thư viện Excel. Kết nối mạng để nhập Excel hoặc dùng data.js.'));
      };
      document.head.append(script);
    });
  }
  return lxLib;
}

async function readLX(buffer) {
  await loadLXLib();
  const workbook = XLSX.read(buffer, { type: 'array' });
  for (const name of workbook.SheetNames) {
    const sheet = workbook.Sheets[name];
    const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });
    const columns = stockColumnIndexes(raw[0]);
    if (!columns) continue;
    const formatted = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });
    const stock = buildStock(raw, columns, formatted);
    if (stock.items.length) return stock;
    throw Error('Không có vật tư hợp lệ trong bảng LX02.');
  }
  throw Error('Không tìm thấy bảng LX02 có đủ cột bắt buộc.');
}

let lxLoadToken = 0;
let lxLib;

function resetSearch() {
  clearTimeout(search.timer);
  $('sceneQ').value = '';
  query = '';
  warehouseView = '3d';
}

function setSource(name) {
  $('lxStatus').textContent = name;
  $('notice').hidden = true;
}

function applyStock(next, name, updatedAt = '') {
  const keepOverview = overview;
  db = next;
  restoreManual();
  selectedCab = db.cabinets[0]?.id || '';
  selectedDrawer = 1;
  selectedCell = null;
  selectedItem = null;
  overview = true;
  sortStockRows();
  invalidateWarehouseIndex();
  updateDataStats();
  findMatches();
  if (matches.length) {
    selectItem(matches[0]);
    overview = keepOverview;
  }
  const count = db.items.length.toLocaleString('vi-VN') + ' bản ghi';
  setSource([name, count, updatedAt && ('Cập nhật ' + updatedAt)].filter(Boolean).join(' · '));
  render();
}

$('pickLX').onclick = () => $('lxFile').click();
$('lxFile').onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;
  const token = ++lxLoadToken;
  const previousStatus = $('lxStatus').textContent;
  $('lxStatus').textContent = 'Đang đọc ' + file.name;
  try {
    const next = await readLX(await file.arrayBuffer());
    if (token !== lxLoadToken) return;
    applyStock(next, file.name);
    toast('Đã đọc Excel LX02');
  } catch (error) {
    if (token === lxLoadToken) {
      $('lxStatus').textContent = db.items.length ? previousStatus : 'Chưa có dữ liệu';
      toast(error.message);
    }
  } finally {
    event.target.value = '';
  }
};

try {
  const table = window.duLieuCongTy;
  if (!Array.isArray(table)) {
    throw Error('Đặt data.js cùng thư mục với So_do_kho_3D.html. File cần khai báo window.duLieuCongTy.');
  }
  const columns = stockColumnIndexes(table[0]);
  if (!columns) {
    throw Error('Dòng tiêu đề trong data.js cần có Material, Material Description, Storage Bin, Available stock và Base Unit of Measure.');
  }
  const stock = buildStock(table, columns);
  if (table.length > 1 && !stock.items.length) {
    throw Error('data.js không có dòng vật tư hợp lệ với mã vật tư, Storage Bin và tồn kho.');
  }
  applyStock(stock, 'data.js', String(window.thoiGianCapNhat ?? '').trim());
} catch (error) {
  $('lxStatus').textContent = 'Chưa đọc được data.js';
  $('notice').textContent = error.message;
  $('notice').hidden = false;
  updateDataStats();
  render();
}
